name: LittleBibi
options:
  bundleIdPrefix: com.cengiz
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LittleBibi:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: LittleBibiWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LittleBabbi
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLName: com.cengiz.bebek
            CFBundleURLSchemes: [littlebibi]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cengiz.bebek
        CODE_SIGN_ENTITLEMENTS: App/LittleBibi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LittleBibiWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: LittleBabbi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cengiz.bebek.widget
schemes:
  LittleBibi:
    build:
      targets:
        LittleBibi: all
    archive:
      config: Release
