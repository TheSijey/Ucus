name: TestFlight Varliklarim

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight'a yükle (kapalıysa sadece derleme testi)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'Varliklarim/**'
      - '!Varliklarim/alerts/**'
      - '.github/workflows/varliklar-testflight.yml'

jobs:
  build:
    runs-on: macos-15
    environment: APPLE_TEAM_ID
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Varliklarim
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] && sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: XcodeGen ile proje oluştur
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect anahtarı
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Yapıştırırken bozulan satır sonlarını/boşlukları düzeltip geçerli PEM'e çevir
          python3 - "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" <<'PY'
          import os, re, sys, base64, textwrap
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END)[A-Z ]*-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          print("Başlık var mı:", "BEGIN" in raw, "| Anahtar uzunluğu:", len(body), "karakter (normali 200)")
          base64.b64decode(body)  # bozuksa burada hata verir
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(sys.argv[1], "w").write(pem)
          PY

      # İmzasız arşiv; imzayı aşağıda Apple'ın bulut sertifikası atar (Mac'te sertifika gerekmez).
      - name: Alarm sunucusu adresi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=""
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain',''))" || true)
          fi
          if [ -n "$SUB" ]; then echo "ALERTS_URL=https://varliklar-alerts.$SUB.workers.dev" >> "$GITHUB_ENV"; else echo "ALERTS_URL=" >> "$GITHUB_ENV"; fi
          echo "Alarm adresi: ${SUB:-yok}"

      - name: Arşivle
        run: |
          xcodebuild archive \
            -project Varliklarim.xcodeproj -scheme Varliklarim -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Varliklarim.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            ALERTS_URL="$ALERTS_URL" \
            CODE_SIGNING_ALLOWED=NO

      # İmzasız arşive bildirim yetkisini geçici imzayla ekle; asıl imzayı dışa aktarma atar.
      - name: Yetkileri ekle
        run: |
          APP="$RUNNER_TEMP/Varliklarim.xcarchive/Products/Applications/Varliklarim.app"
          codesign --force --sign - --entitlements App/Varliklarim.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -A1 aps-environment || true

      - name: İmzala ve TestFlight'a yükle
        if: ${{ github.event_name == 'push' || inputs.upload }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Varliklarim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
