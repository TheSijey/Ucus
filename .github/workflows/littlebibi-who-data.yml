name: LittleBibi DSÖ verisi (tek seferlik)
on:
  push:
    branches: [littlebibi]
    paths: [".github/workflows/littlebibi-who-data.yml"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: DSÖ tablolarını indir ve yazdır
        run: |
          pip install --quiet openpyxl
          mkdir -p who && cd who
          for page in weight-for-age length-height-for-age head-circumference-for-age; do
            curl -fsSL -A "Mozilla/5.0" "https://www.who.int/tools/child-growth-standards/standards/$page" -o "$page.html"
            grep -oE 'https://cdn\.who\.int[^"]+\.xlsx[^"]*' "$page.html" | sed 's/&amp;/\&/g' | sort -u > "$page.links"
            echo "== $page"; cat "$page.links"
          done
          cat *.links | grep -iE 'z-?scores|zscores' | grep -iE '0-to-5|0_5|0-5|0-to-2|0_2|0-2' | sort -u > pick.txt
          echo "== seçilen"; cat pick.txt
          i=0; while read -r u; do i=$((i+1)); curl -fsSL -A "Mozilla/5.0" "$u" -o "f$i.xlsx" && echo "$u" > "f$i.url"; done < pick.txt
          python3 - <<'PY'
          import glob, openpyxl
          for f in sorted(glob.glob("f*.xlsx")):
              url = open(f.replace(".xlsx", ".url")).read().strip()
              ws = openpyxl.load_workbook(f, data_only=True).active
              rows = list(ws.iter_rows(values_only=True))
              head = [str(c).strip() if c is not None else "" for c in rows[0]]
              print("##FILE", url.split("/")[-1].split("?")[0])
              print("##HEAD", head)
              def col(name):
                  for i, h in enumerate(head):
                      if h.lower() == name.lower():
                          return i
                  return None
              m, a, b, c = col("Month") if col("Month") is not None else col("Day"), col("SD2neg"), col("SD0"), col("SD2")
              for r in rows[1:]:
                  if r[m] is None: continue
                  if int(r[m]) > 24 and head[m].lower() == "month": break
                  print("##ROW", int(r[m]), r[a], r[b], r[c])
          PY
