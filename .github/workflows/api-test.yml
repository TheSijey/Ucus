name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: CDM servis
        continue-on-error: true
        run: |
          curl -s https://mobilecdm.igairport.aero/main.6c7227d6935ca229.js | grep -oE 'getDefaultHeaders\(.{0,400}' | head -2
          for q in TK828 828 TK1355 LPO; do
            echo "=== $q"; curl -s -m 20 -H "Auto-Refresh: true" -H "Accept: application/json" "https://mobilecdm.igairport.aero/Service/api/Flight/$q" | head -c 1500; echo
          done
