name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: APPLE_TEAM_ID
    steps:
      - name: AeroDataBox - dönüş TK1306 kalkış gate'i
        continue-on-error: true
        env:
          KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          for d in 1 2; do
            day=$(date -u -d "-$d day" +%F)
            curl -s -o out.json -w "$day HTTP %{http_code}\n" \
              -H "x-rapidapi-key: $KEY" -H "x-rapidapi-host: aerodatabox.p.rapidapi.com" \
              "https://aerodatabox.p.rapidapi.com/flights/number/TK1306/$day?withAircraftImage=false&withLocation=false"
            jq -r '.[] | "  \(.number) \(.departure.airport.icao)->\(.arrival.airport.icao) depGate=\(.departure.gate // "-") depTerm=\(.departure.terminal // "-") depRwy=\(.departure.runway // "-") checkIn=\(.departure.checkInDesk // "-")"' out.json || true
          done
      - name: OpenStreetMap - Malaga
        continue-on-error: true
        run: |
          q='[out:json][timeout:25];way["aeroway"="taxiway"](36.64,-4.53,36.70,-4.46);out tags;'
          curl -s --data-urlencode "data=$q" https://overpass-api.de/api/interpreter -o osm.json -w "HTTP %{http_code}\n"
          jq -r '"taksi yolu parçası: \(.elements|length)"' osm.json || head -c 300 osm.json
          jq -r '[.elements[].tags.ref // empty] | unique | join(", ")' osm.json || true
          q2='[out:json][timeout:25];(node["aeroway"="parking_position"](36.64,-4.53,36.70,-4.46);node["aeroway"="gate"](36.64,-4.53,36.70,-4.46);way["aeroway"="parking_position"](36.64,-4.53,36.70,-4.46););out tags;'
          curl -s --data-urlencode "data=$q2" https://overpass-api.de/api/interpreter -o osm2.json -w "HTTP %{http_code}\n"
          jq -r '"stand/gate: \(.elements|length)"' osm2.json || true
          jq -r '[.elements[] | "\(.tags.aeroway):\(.tags.ref // "?")"] | .[0:50] | join(", ")' osm2.json || true
