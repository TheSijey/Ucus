name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: atis.guru kart yapısı
        continue-on-error: true
        run: |
          curl -s -L -m 20 -A "Mozilla/5.0" -o p.html "https://atis.guru/atis/LTFM"
          python3 - <<'PY'
          s = open('p.html', encoding='utf-8').read()
          i = s.find('Requested by')
          print(s[i-700:i+900])
          PY
