name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: IATA -> ICAO tablosu
        run: |
          curl -sL https://davidmegginson.github.io/ourairports-data/airports.csv -o airports.csv
          python3 - <<'PY'
          import csv, json
          out = {}
          for r in csv.DictReader(open('airports.csv', encoding='utf-8')):
              if r['type'] not in ('large_airport', 'medium_airport'): continue
              iata = r['iata_code'].strip(); icao = (r.get('icao_code') or r['gps_code']).strip()
              if len(iata) == 3 and len(icao) == 4 and icao.isalpha():
                  if iata not in out or r['type'] == 'large_airport':
                      out[iata] = [icao, r['municipality'].strip()]
          json.dump(out, open('iata.json', 'w'), ensure_ascii=False, separators=(',', ':'), sort_keys=True)
          print(len(out), out.get('BEY'), out.get('LUX'), out.get('BER'), out.get('COV'))
          PY
          ls -la iata.json
      - uses: actions/upload-artifact@v4
        with:
          name: iata
          path: iata.json
