name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: FR24 apple-app-site-association
        continue-on-error: true
        run: |
          for host in www.flightradar24.com flightradar24.com fr24.com www.fr24.com; do
            echo "=== $host"
            curl -sL -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)" -w "\nHTTP %{http_code}\n" "https://$host/.well-known/apple-app-site-association" | head -c 3000; echo
          done
