name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: APPLE_TEAM_ID
    steps:
      - name: TK828
        env:
          KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          for d in 2026-11-13 2026-11-14; do
            curl -s -o o.json -w "http=%{http_code}\n" -H "x-rapidapi-key: $KEY" -H "x-rapidapi-host: aerodatabox.p.rapidapi.com" \
              "https://aerodatabox.p.rapidapi.com/flights/number/TK828/$d?withAircraftImage=false&withLocation=false"
            echo "== $d"; jq -r '.[]? | "\(.number) \(.departure.airport.icao)->\(.arrival.airport.icao) dep=\(.departure.scheduledTime.utc) local=\(.departure.scheduledTime.local)"' o.json || head -c 300 o.json
          done
          echo "== airport BEY"; curl -s "https://aviationweather.gov/api/data/airport?ids=BEY&format=json" | head -c 300; echo
          echo "== airport OLBA"; curl -s "https://aviationweather.gov/api/data/airport?ids=OLBA&format=json" | jq -r '.[0] | "\(.icaoId) \(.iataId)"'
