name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: atis.guru kapsamı
        continue-on-error: true
        run: |
          for a in LTFM LTFJ OLBA GMMX EBBR ELLX EDDB EKCH KJFK; do
            code=$(curl -s -L -m 20 -A "Mozilla/5.0" -o p.html -w "%{http_code}" "https://atis.guru/atis/$a")
            txt=$(sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' p.html | tr -s ' \n' ' ' | grep -oiE "(ATIS|INFORMATION|INFO) .{0,220}" | head -1)
            echo "=== $a http=$code :: ${txt:0:260}"
          done
