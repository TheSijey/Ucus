name: API test
on:
  push:
    branches: [api-test]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: APPLE_TEAM_ID
    steps:
      - name: TK1939 / TK1940 gate'leri
        continue-on-error: true
        env:
          KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          for f in TK1939 TK1940 TK1938; do
            for d in 0 1 2 3; do
              day=$(date -u -d "-$d day" +%F)
              curl -s -o out.json -H "x-rapidapi-key: $KEY" -H "x-rapidapi-host: aerodatabox.p.rapidapi.com" \
                "https://aerodatabox.p.rapidapi.com/flights/number/$f/$day?withAircraftImage=false&withLocation=false"
              jq -r --arg f "$f" --arg d "$day" '.[]? | "\($f) \($d) \(.departure.airport.icao)->\(.arrival.airport.icao) depGate=\(.departure.gate // "-") arrGate=\(.arrival.gate // "-") dep=\(.departure.scheduledTime.utc // "-") status=\(.status)"' out.json 2>/dev/null || echo "$f $day: $(head -c 120 out.json)"
            done
          done
