name: Ucus
options:
  bundleIdPrefix: com.cengiz
  developmentLanguage: tr
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.5.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    AEROAPI_KEY: ""
    RAPIDAPI_KEY: ""
targets:
  Ucus:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: UcusWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Uçuş
        CFBundleDevelopmentRegion: tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleLocalizations: [tr, en]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Ev konumunu bir kez almak için; havalimanına yol süresini hesaplamakta kullanılır ve sadece telefonunda saklanır.
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.cengiz.ucus.cleanup]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.cengiz.ucus
            CFBundleURLSchemes: [ucus]
        AeroAPIKey: $(AEROAPI_KEY)
        UcusCloudKit: "YES"
        RapidAPIKey: $(RAPIDAPI_KEY)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cengiz.ucus
        CODE_SIGN_ENTITLEMENTS: App/Ucus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  UcusWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Uçuş
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleLocalizations: [tr, en]
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cengiz.ucus.widget
        CODE_SIGN_ENTITLEMENTS: Widget/UcusWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
schemes:
  Ucus:
    build:
      targets:
        Ucus: all
    archive:
      config: Release
